services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0
    command: ["mlflow", "server",
              "--host", "0.0.0.0", "--port", "5000",
              "--backend-store-uri", "sqlite:////mlflow/mlflow.db",
              "--artifacts-destination", "/mlflow/artifacts",
              "--allowed-hosts", "*"]
    
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow

  api:
    build: .
    ports: 
      - "8000:8000"
      
  frontend:
    build: ./frontend
    ports: 
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api

volumes:
 mlflow_data: